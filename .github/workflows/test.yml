name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check dist/ is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/ || (echo "::error::dist/ is out of date. Run npm run build and commit it." && exit 1)
